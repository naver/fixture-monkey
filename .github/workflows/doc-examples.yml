name: Doc examples test

on:
  push:
    branches: [ main, '[0-9]*.[0-9]*.x' ]
    paths:
      - 'docs/**'
      - 'fixture-monkey-tests/doc-examples/**'
  pull_request:
    branches: [ main, '[0-9]*.[0-9]*.x' ]
    paths:
      - 'docs/**'
      - 'fixture-monkey-tests/doc-examples/**'
  workflow_dispatch:

jobs:
  test:
    name: Doc examples test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # MIT-licensed provider. The default 'enhanced' bundles the proprietary gradle-actions-caching component.
          cache-provider: basic
      - name: Run doc example tests
        run: ./gradlew :fixture-monkey-tests:doc-examples:java-examples:test :fixture-monkey-tests:doc-examples:kotlin-examples:test
