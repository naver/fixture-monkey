version: 2
updates:
  # Docs site (Docusaurus). Every one of the initial 69 Dependabot alerts came
  # from docs/package-lock.json, so this is the entry that matters most.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # @docusaurus/* must move in lockstep: core, preset-classic, types,
      # tsconfig and module-type-aliases are pinned to the exact same version
      # and a mismatch fails the build. Never let these split across PRs.
      docusaurus:
        patterns:
          - "@docusaurus/*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Gradle. Almost every module resolves versions through
  # gradle/libs.versions.toml (covered by "/"), but buildSrc and
  # object-farm-api declare coordinates inline, so they need their own entries.
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/buildSrc"
      - "/object-farm-api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # The published artifacts target Java 8 and CI runs tests on JDK 8, but
    # Dependabot has no notion of a bytecode baseline for Gradle - it only
    # compares semver. Versions that drop Java 8 arrive as minor updates
    # (logback 1.2.9 -> 1.6.1 moves class 50 -> class 55), so the update-types
    # filter below does not protect the baseline on its own. Every ceiling here
    # is the last version whose bytecode is class 52, read from Gradle module
    # metadata or the published jar.
    ignore:
      # 2.0.0 is class 61 (Java 17); 1.9.x is the last Java 8 line.
      - dependency-name: "net.datafaker:datafaker"
        versions:
          - ">= 2"
      # The platform jumped 1.13.x -> 6.0.0 to align with Jupiter 6, which is
      # class 61 (Java 17). The 1.x line stays on Java 8.
      - dependency-name: "org.junit.platform:*"
        versions:
          - ">= 2"
      # Jupiter 6.0.0 is class 61 (Java 17); 5.13.x is the last Java 8 line.
      - dependency-name: "org.junit.jupiter:*"
        versions:
          - ">= 6"
      # 1.4.0 onwards is class 55 (Java 11); Java 8 stops at 1.3.x.
      - dependency-name: "ch.qos.logback:*"
        versions:
          - ">= 1.4"
      # 5.0.0 onwards is class 55 (Java 11); 4.11.0 is the last Java 8 release.
      - dependency-name: "org.mockito:*"
        versions:
          - ">= 5"
      # 6.0.0 onwards is class 55 (Java 11); 5.9.1 is the last Java 8 release.
      - dependency-name: "io.kotest:*"
        versions:
          - ">= 6"
      # hibernate-validator6 (6.2.1.Final, javax) and hibernate-validator7
      # (7.0.5.Final, jakarta) deliberately pin one coordinate to two majors.
      # Ignores are per-coordinate, so no range can hold one entry on 6.x while
      # the other moves within 7.x - #1301 bumped both to 9.1.3 at once, and a
      # ">= 8" ceiling would still drag 6.2.1 onto jakarta-only 7.x. Pinned by
      # hand instead. For the record, 8.0.3 is class 55 and 9.1.3 is class 61.
      - dependency-name: "org.hibernate.validator:hibernate-validator"
      # MonkeyStringArbitrary extends jqwik internals - StringArbitrary,
      # RandomGenerators, ExhaustiveGenerators and ShrinkableString - which
      # change across minor releases regardless of the Java baseline: 1.10.1 is
      # still class 52, yet it changed the ShrinkableString constructors and
      # added StringArbitrary.uniqueChars().
      - dependency-name: "net.jqwik:*"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions. Every gradle/actions/setup-gradle step sets
  # cache-provider: basic on purpose: from v6 the default 'enhanced' provider
  # bundles the proprietary gradle-actions-caching component, and basic keeps
  # the pipeline on MIT-licensed code. Keep that input when taking a bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
